spring.application.name=dt-control-power

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dt_control_power}
spring.datasource.username=${DB_USERNAME:dt_control_power}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

logging.structured.format.console=${LOGGING_STRUCTURED_FORMAT_CONSOLE:logstash}

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=30m

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.file-storage.path=${FILE_STORAGE_PATH:./data/uploads}
